name: Build Gesturefy Mac DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # Step 4: Build .app bundle with PyInstaller
      - name: Build Gesturefy app
        run: |
          pyinstaller --noconfirm --windowed --name Gesturefy main.py

      # Step 5: Create DMG with Applications link
      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          mkdir -p dist/tmp_dmg
          cp -R "dist/Gesturefy.app" dist/tmp_dmg/
          ln -s /Applications dist/tmp_dmg/Applications
          hdiutil create -volname "Gesturefy" \
            -srcfolder dist/tmp_dmg \
            -ov -format UDZO dist/dmg/Gesturefy_mac.dmg

      # Step 6: Upload DMG as artifact
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gesturefy_mac
          path: dist/dmg/Gesturefy_mac.dmg
