name: macOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build Gesturefy app
      run: |
        pyinstaller --noconsole --windowed main.py

    - name: Create DMG
      run: |
        mkdir -p dist/dmg
        hdiutil create dist/dmg/Gesturefy.dmg -srcfolder dist/main.app -ov

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: gesturefy-macos-build
        path: |
          dist/main.app
          dist/dmg/Gesturefy.dmg
