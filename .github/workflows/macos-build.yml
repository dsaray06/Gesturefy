name: Build Gesturefy Mac DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # Step 4: Build app with PyInstaller
      - name: Build Gesturefy DMG
        run: |
          pyinstaller --noconfirm --windowed --name Gesturefy main.py
          mkdir -p dist/dmg
          hdiutil create -volname "Gesturefy" -srcfolder dist/Gesturefy.app -ov -format UDZO dist/dmg/Gesturefy_mac.dmg

      # Step 5: Upload DMG as artifact
      - name: Upload DMG
        uses: actions/upload-artifact@v3
        with:
          name: Gesturefy_mac
          path: dist/dmg/Gesturefy_mac.dmg
